name: Distribution checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install publication tooling (separate from benchmark environment)
        run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7' 'cffconvert>=2,<3'
      - name: Validate citation and build both distributions
        run: |
          cffconvert --validate
          python -m build
          python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Install real wheel and exercise API and CLI outside checkout
        run: |
          python -m pip install dist/*.whl
          python examples/check_distribution.py
          python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: alga-twin-distributions-python-${{ matrix.python-version }}
          path: dist/
          retention-days: 90
