site_name: AlgaTwin
site_description: Evidence-aware microalgal batch modelling and conditional calibration
repo_url: https://github.com/ysmhla/alga-twin
repo_name: ysmhla/alga-twin
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
nav:
  - Start here: index.md
  - Guided workflow: GUIDED_WORKFLOW.md
  - Equations and units: MODEL.md
  - Parameter audit: PARAMETER_AUDIT.md
  - Selectable models: SELECTABLE_MODELS.md
  - Calibration: CALIBRATION.md
  - Model support and design: DECISION_SUPPORT.md
  - Verification: VERIFICATION.md
  - Usability: USABILITY.md
  - Related work (unreviewed): RELATED_WORK.md
  - Publication status: PUBLICATION.md
  - Release status: RELEASE_STATUS.md
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
