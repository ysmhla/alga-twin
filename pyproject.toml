[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alga-twin"
version = "0.2.1"
description = "Transparent mechanistic simulation and calibration of batch microalgal cultivation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "AlgaTwin contributors"}]
keywords = ["microalgae", "photobioreactor", "digital twin", "monod", "bioprocess"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics"]
dependencies = ["numpy>=1.26,<3", "pandas>=2.0,<3", "scipy>=1.11,<2"]

[project.scripts]
alga-twin = "alga_twin.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
